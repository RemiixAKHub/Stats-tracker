name: Fix final Sonar issue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-final-sonar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor generateNotes cognitive complexity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tracker.html')
          text = path.read_text(encoding='utf-8')

          old = """    function addNoteLine(lines, label, value) {
              if (value) lines.push('- ' + label + ': ' + value);
          }

          function generateNotes() {
          """
          new = """    function addNoteLine(lines, label, value) {
              if (value) lines.push('- ' + label + ': ' + value);
          }

          function buildPlanDetail(plan) {
              if (plan !== 'Yes' && plan !== 'P2P') return plan;

              const amount = fieldValue('notePlanAmount');
              const duration = fieldValue('notePlanMonths');
              let detail = plan;
              if (amount) detail += ' - ' + amount;
              if (duration) {
                  detail += plan === 'Yes' ? ' for ' + duration + ' months' : ' on ' + duration;
              }
              return detail;
          }

          function generateNotes() {
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected helper insertion anchor once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_plan = """        const plan = fieldValue('notePlan');
                  if (plan === 'Yes') {
                      const amount = fieldValue('notePlanAmount');
                      const months = fieldValue('notePlanMonths');
                      let planDetail = 'Yes';
                      if (amount) planDetail += ' - ' + amount;
                      if (months) planDetail += ' for ' + months + ' months';
                      addNoteLine(lines, 'Plan Set', planDetail);
                  } else if (plan === 'P2P') {
                      const amount = fieldValue('notePlanAmount');
                      const date = fieldValue('notePlanMonths');
                      let planDetail = 'P2P';
                      if (amount) planDetail += ' - ' + amount;
                      if (date) planDetail += ' on ' + date;
                      addNoteLine(lines, 'Plan Set', planDetail);
                  } else {
                      addNoteLine(lines, 'Plan Set', plan);
                  }
          """
          new_plan = """        const plan = fieldValue('notePlan');
                  addNoteLine(lines, 'Plan Set', buildPlanDetail(plan));
          """
          if text.count(old_plan) != 1:
              raise SystemExit(f'Expected plan branch once, found {text.count(old_plan)}')
          text = text.replace(old_plan, new_plan, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('tracker.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/tracker.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/tracker.js
          git diff --check

      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-final-sonar.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reduce generateNotes cognitive complexity'
          git push origin HEAD:main
