name: Fix final Sonar issue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-final-sonar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor generateNotes cognitive complexity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tracker.html')
          text = path.read_text(encoding='utf-8')

          generate_marker = "    function generateNotes() {"
          if text.count(generate_marker) != 1:
              raise SystemExit(f'Expected generateNotes marker once, found {text.count(generate_marker)}')

          helper = "\n".join([
              "    function buildPlanDetail(plan) {",
              "        if (plan !== 'Yes' && plan !== 'P2P') return plan;",
              "",
              "        const amount = fieldValue('notePlanAmount');",
              "        const duration = fieldValue('notePlanMonths');",
              "        let detail = plan;",
              "        if (amount) detail += ' - ' + amount;",
              "        if (duration) {",
              "            detail += plan === 'Yes' ? ' for ' + duration + ' months' : ' on ' + duration;",
              "        }",
              "        return detail;",
              "    }",
              "",
          ])
          text = text.replace(generate_marker, helper + generate_marker, 1)

          function_start = text.index(generate_marker)
          plan_start_marker = "        const plan = fieldValue('notePlan');"
          plan_end_marker = "        addNoteLine(lines, 'Additional Info', fieldValue('noteAdditional'));"
          plan_start = text.index(plan_start_marker, function_start)
          plan_end = text.index(plan_end_marker, plan_start)
          replacement = "\n".join([
              "        const plan = fieldValue('notePlan');",
              "        addNoteLine(lines, 'Plan Set', buildPlanDetail(plan));",
              "",
          ])
          text = text[:plan_start] + replacement + text[plan_end:]

          if "if (plan === 'Yes')" in text[text.index(generate_marker):text.index('    async function copyGeneratedNotes()')]:
              raise SystemExit('Old plan branch still present inside generateNotes')

          path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('tracker.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/tracker.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/tracker.js
          git diff --check

      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-final-sonar.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reduce generateNotes cognitive complexity'
          git push origin HEAD:main
